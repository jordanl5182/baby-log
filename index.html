<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131B" media="(prefers-color-scheme: dark)">
<title>Baby log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#E9EBF6; --ink:#1D2340; --muted:#5F6587; --line:#DCDFEE;
  --feed:#4B5BD6; --feed-soft:#E2E5FB; --wet:#1F8FC4; --dirty:#9A6331; --mixed:#7E57C8;
  --sleep:#2A8670; --other:#B8741F; --danger:#B93A27; --on-accent:#FFFFFF;
  --shadow:0 10px 30px -12px rgba(29,35,64,.25);
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#11142A; --surface:#1A1E3A; --surface-2:#242948; --ink:#ECEEFA; --muted:#A3A8C9; --line:#2E3458;
    --feed:#8F9BFF; --feed-soft:#272D5C; --wet:#5EC2EF; --dirty:#D5A06A; --mixed:#B79CFF;
    --sleep:#62C9AB; --other:#EAAA5C; --danger:#FF8A73; --on-accent:#11142A;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--feed);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding:12px 18px 140px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.name{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 72;font-weight:600;font-size:30px;letter-spacing:-.01em;margin:0}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--sleep);display:inline-block}
.status.warn i{background:var(--other)}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}

.banner{background:var(--feed-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px;line-height:1.4}
.banner .primary{text-decoration:none}
.banner{margin-bottom:10px}
.banner > button:not(.primary){background:none;border:0;padding:0;color:var(--feed);font-weight:700;text-decoration:underline}

/* hero */
.hero{background:var(--surface);border-radius:26px;padding:20px 20px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .label{font-size:14px;color:var(--muted);margin:0 0 2px}
.since{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 144;font-weight:500;font-size:64px;line-height:1;letter-spacing:-.03em;margin:2px 0 6px;color:var(--feed)}
.since small{font-size:22px;letter-spacing:0;color:var(--muted);font-weight:400;margin-left:4px}
.hero .what{font-size:15px;color:var(--ink);margin:0}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mini .k{font-size:13px;color:var(--muted)}
.mini .v{font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:24px;font-weight:500;margin-top:2px}
.mini .s{font-size:13px;color:var(--muted);margin-top:1px}
.asleep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:color-mix(in srgb,var(--sleep) 14%,transparent);border-radius:16px;padding:10px 12px}
.asleep span{font-weight:600;color:var(--sleep)}
.asleep button{border:0;background:var(--sleep);color:var(--on-accent);border-radius:12px;padding:9px 14px;font-weight:700}

/* day switch */
.days{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:9px 16px;border-radius:11px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.date{font-size:14px;color:var(--muted)}

/* ribbon */
.ribbon{background:var(--surface);border-radius:20px;padding:14px 14px 10px}
.lanes{position:relative;height:74px}
.lane{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%}
.dot.feed{background:var(--feed)}
.dot.wet{background:var(--wet)} .dot.dirty{background:var(--dirty)} .dot.mixed{background:var(--mixed)}
.bar{position:absolute;height:8px;border-radius:4px;background:var(--sleep);opacity:.85;transform:translateY(-50%)}
.nowline{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.25;border-radius:1px}
.hours{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* totals */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tot{background:var(--surface);border-radius:18px;padding:12px 14px}
.tot .n{white-space:nowrap;font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:26px;font-weight:500;line-height:1.1}
.tot .t{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}

/* list */
.list{margin-top:18px;background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 34px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.badge{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.badge svg{width:19px;height:19px}
.row .ti{font-weight:600;font-size:15px}
.row .su{font-size:13px;color:var(--muted);margin-top:1px}
.who{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}

/* action bar */
.actions{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.actions .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{border:0;border-radius:20px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:14px;color:var(--on-accent);box-shadow:var(--shadow)}
.act svg{width:26px;height:26px}
.act.feed{background:var(--feed)} .act.nappy{background:var(--wet)} .act.sleep{background:var(--sleep)} .act.more{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 48;font-weight:600;font-size:26px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{border:0;background:var(--surface-2);border-radius:12px;width:38px;height:38px;font-size:20px;line-height:1}
.field{margin:16px 0 0}
.field > .lab{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg.full{display:flex}
.seg.full button{flex:1}
.amount{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:20px;padding:8px}
.amount button{width:56px;height:56px;border-radius:16px;border:0;background:var(--surface);font-size:28px;font-weight:500}
.amount .val{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 144;font-size:48px;font-weight:500;letter-spacing:-.02em}
.amount .val small{font-size:20px;color:var(--muted);margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;border-radius:22px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--on-accent)}
.tile svg{width:34px;height:34px}
.tile.wet{background:var(--wet)} .tile.dirty{background:var(--dirty)} .tile.mixed{background:var(--mixed)}
.tile[aria-pressed="false"]{opacity:.45}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 4px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt svg{width:22px;height:22px;color:var(--other)}
.opt[aria-pressed="true"]{border-color:var(--other);background:color-mix(in srgb,var(--other) 14%,var(--surface))}
input[type=text],input[type=number],input[type=time],input[type=url],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
textarea{min-height:70px;resize:vertical}
.primary{width:100%;border:0;border-radius:18px;padding:17px;font-weight:700;font-size:17px;background:var(--feed);color:var(--on-accent)}
.foot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--surface);margin:20px -20px 0;padding:12px 20px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.primary.sleep{background:var(--sleep)} .primary.other{background:var(--other)} .primary.wet{background:var(--wet)}
.ghost{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font-weight:600;background:none;margin-top:10px}
.ghost.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.linky{background:none;border:0;padding:0;color:var(--feed);font-weight:600;font-size:14px}

/* toast */
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:600;font-size:15px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--bg);font-weight:800;text-decoration:underline;padding:0}
@media (prefers-reduced-motion: reduce){ .sheet,.scrim,.toast{transition:none} }
/* v2 additions */
.head-btns{display:flex;gap:8px}
.days{margin:26px 2px 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.legend i.bar{width:16px;height:6px;border-radius:3px;background:var(--sleep)}
.mini .s2{font-size:12px;color:var(--muted);margin-top:4px}
.weekrows{display:grid;gap:6px}
.weekrow{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px}
.weekrow .dl{font-size:12px;font-weight:600;color:var(--muted)}
.weekrow .dl.today{color:var(--ink)}
.wlane{position:relative;height:22px;border-radius:6px;background:var(--surface-2)}
.wlane .dot{top:50%}
.wlane .bar{top:50%;height:6px}
.card{background:var(--surface);border-radius:20px;padding:14px;margin-top:14px}
.card h3{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 36;font-weight:600;font-size:20px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg.small button{padding:7px 11px;font-size:13px}
.cmp{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;align-items:center}
.cmp .rl{font-size:12px;font-weight:600;color:var(--muted)}
.hours2{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.avgbars{display:flex;align-items:flex-end;height:22px;gap:1px;background:var(--surface-2);border-radius:6px;padding:0 2px;overflow:hidden}
.avgbars i{flex:1;border-radius:2px 2px 0 0;min-height:0}
.bythis{font-size:14px;line-height:1.5;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.bythis b{font-weight:700}
.filters{display:flex;gap:6px;overflow-x:auto;margin:18px -2px 0;padding:2px}
.filters .chip{padding:7px 13px;font-size:14px;white-space:nowrap}
.dayhead{padding:10px 14px 6px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface-2)}
.amount input{width:140px;text-align:center;border:0;background:none;font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 144;font-size:48px;font-weight:500;letter-spacing:-.02em;padding:0;-moz-appearance:textfield}
.amount input::-webkit-outer-spin-button,.amount input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amount .unit{font-size:20px;color:var(--muted)}
.amount .mid{display:flex;align-items:baseline;justify-content:center;gap:4px}
input[type=datetime-local]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.newtype{display:flex;gap:8px;margin-top:10px}
.newtype input{flex:1}
.newtype button{border:0;border-radius:14px;padding:0 16px;font-weight:700;background:var(--other);color:var(--on-accent)}
/* history */
#history{display:none}
body.hist #home{display:none}
body.hist #history{display:block}
body.hist .actions{display:none}
.backrow{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.chart{width:100%;height:150px;display:block}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.chart .lab{font-size:9px}
.pcard{border-top:1px solid var(--line);padding:12px 0}
.pcard:first-of-type{border-top:0;padding-top:4px}
.pcard .pt{font-weight:700;font-size:15px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .n{font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:20px;font-weight:500}
.stats .t{font-size:12px;color:var(--muted);line-height:1.35}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.rec .n{font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:22px;font-weight:500}
.rec .t{font-size:12px;color:var(--muted);line-height:1.35}
.more{width:100%;border:0;background:var(--surface-2);padding:13px;font-weight:700;color:var(--feed)}
/* ---------- v3: refined, professional look ---------- */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F0F1F4; --ink:#161B26; --muted:#667085; --line:#E4E7EC;
  --feed:#3E4FD0; --feed-soft:#EEF0FD; --wet:#1F84BF; --dirty:#8C5A2B; --mixed:#7556C2;
  --sleep:#24806A; --other:#B06A14; --danger:#C0352B; --on-accent:#FFFFFF;
  --shadow:none;
  --display:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F131B; --surface:#171C26; --surface-2:#1F2531; --ink:#EEF1F6; --muted:#98A2B3; --line:#2A3140;
    --feed:#8E9BFF; --feed-soft:#232A4D; --wet:#62BDEB; --dirty:#D3A06C; --mixed:#B59CFF;
    --sleep:#5CC5A6; --other:#E8A75A; --danger:#FF8B78; --on-accent:#0F131B;
  }
}
body{font-feature-settings:"tnum" 1, "cv11" 1}
.wrap{padding:0 16px 132px}

/* app bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:0 -16px 14px;padding:12px 16px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line)}
.name{font-family:var(--display);font-variation-settings:normal;font-weight:700;font-size:22px;letter-spacing:-.02em}
.status{font-size:12.5px;margin-top:1px}
.icon-btn{width:40px;height:40px;border-radius:var(--r-md);background:var(--surface)}
.icon-btn svg{width:20px;height:20px}

/* cards share one quiet treatment */
.hero,.ribbon,.tot,.card,.list{border:1px solid var(--line);box-shadow:none}
.banner{border:1px solid color-mix(in srgb,var(--feed) 25%,transparent);border-radius:var(--r-md)}

/* status panel */
.hero{border-radius:var(--r-lg);padding:18px 18px 16px}
.hero .label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.since{font-family:var(--display);font-variation-settings:normal;font-weight:700;font-size:52px;letter-spacing:-.04em;color:var(--ink);margin:4px 0 4px}
.since small{font-size:20px;font-weight:600;letter-spacing:0;margin:0 6px 0 2px}
.hero .what{font-size:14px;color:var(--muted)}
.hero-row{gap:0;margin-top:16px;padding-top:0;border-top:0;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:var(--r-md)}
.mini{padding:12px 14px}
.mini + .mini{border-left:1px solid var(--line)}
.mini .k{font-size:12.5px;font-weight:600}
.mini .v{font-family:var(--display);font-variation-settings:normal;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.mini .s,.mini .s2{font-size:12.5px}
.asleep{border-radius:var(--r-md)}
.asleep button{border-radius:var(--r-sm)}

/* period switch */
.days{margin:22px 0 8px}
.days .seg{display:flex;width:100%}
.days .seg button{flex:1}
.seg{border-radius:var(--r-md);padding:3px}
.seg button{border-radius:var(--r-sm);font-size:14px;padding:8px 12px}
.seg button[aria-pressed="true"]{box-shadow:0 1px 2px rgba(16,24,40,.08),0 0 0 1px var(--line)}
.date{font-size:13px}

/* timeline */
.ribbon{border-radius:var(--r-lg);padding:14px 14px 12px}
.lane{background:var(--line)}
.legend{gap:6px 12px;font-size:11.5px;padding-top:10px;border-top:1px solid var(--line)}
.wlane{border-radius:6px}

/* totals */
.totals{gap:8px;margin-top:8px}
.tot{border-radius:var(--r-md);padding:12px}
.tot .n{font-family:var(--display);font-variation-settings:normal;font-size:24px;font-weight:700;letter-spacing:-.02em}
.tot .t{font-size:12.5px}

/* compare + history cards */
.card{border-radius:var(--r-lg);padding:16px}
.card h3{font-family:var(--display);font-variation-settings:normal;font-size:16px;font-weight:700;letter-spacing:-.01em}
.bythis{font-size:13.5px}
.stats .n,.rec .n{font-family:var(--display);font-variation-settings:normal;font-weight:700;letter-spacing:-.02em}
.rec{border-radius:var(--r-md)}

/* list */
.filters{margin-top:20px}
.filters .chip,.chip{border-radius:var(--r-sm);font-size:14px;font-weight:600;padding:8px 12px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.list{border-radius:var(--r-lg);margin-top:10px}
.row{grid-template-columns:46px 32px 1fr auto;padding:12px 14px;gap:10px}
.row .tm{font-size:14px;font-weight:600;color:var(--muted)}
.badge{width:32px;height:32px;border-radius:var(--r-sm)}
.badge svg{width:18px;height:18px}
.row .ti{font-size:15px;font-weight:600}
.who{font-size:11.5px;font-weight:600}
.dayhead{font-size:12.5px;padding:9px 14px;border-bottom:1px solid var(--line)}

/* action bar: one calm toolbar instead of four candy buttons */
.actions{background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.actions .in{gap:6px}
.act{background:none!important;color:var(--ink)!important;box-shadow:none;border:0!important;border-radius:var(--r-md);padding:6px 4px;font-size:12.5px;font-weight:700;gap:4px}
.act svg{width:22px;height:22px;padding:9px;box-sizing:content-box;border-radius:14px;color:var(--on-accent)}
.act.feed svg{background:var(--feed)} .act.nappy svg{background:var(--wet)} .act.sleep svg{background:var(--sleep)}
.act.more svg{background:var(--surface-2);color:var(--ink)}
.act:active svg{transform:scale(.94)}

/* sheets */
.sheet .in{border-radius:22px 22px 0 0}
.sheet h2{font-family:var(--display);font-variation-settings:normal;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sheet h2 button{border-radius:var(--r-sm);width:34px;height:34px}
.field > .lab{font-size:13px}
.amount{border-radius:var(--r-md)}
.amount button{border-radius:var(--r-sm);width:52px;height:52px}
.amount input{font-family:var(--display);font-variation-settings:normal;font-weight:700;font-size:44px;letter-spacing:-.03em}
.tile{border-radius:var(--r-md)}
.opt{border-radius:var(--r-md)}
input[type=text],input[type=number],input[type=time],input[type=url],input[type=datetime-local],textarea{border-radius:var(--r-sm)}
.primary{border-radius:var(--r-md);padding:15px;font-size:16px}
.ghost{border-radius:var(--r-md)}
.toast{border-radius:var(--r-md);bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.backrow .name{font-size:22px!important}
.legend i.bar{position:static;transform:none;opacity:1;top:auto;left:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="name" id="babyName">Baby</h1>
      <div class="status" id="status"><i></i><span>Loading</span></div>
    </div>
    <div class="head-btns">
      <button class="icon-btn" id="histBtn" aria-label="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="banner"></div>

  <main id="home">
    <section class="hero" aria-live="polite">
      <p class="label">Since last feed</p>
      <div class="since" id="since">–</div>
      <p class="what" id="sinceWhat"></p>
      <div id="asleep"></div>
      <div class="hero-row">
        <div class="mini"><div class="k">Since last nappy</div><div class="v" id="lastNappy">–</div><div class="s" id="lastNappyWhat"></div></div>
        <div class="mini"><div class="k">Today’s milk</div><div class="v" id="todayMl">–</div><div class="s" id="todayFeeds"></div><div class="s2" id="weekAvgMl"></div></div>
      </div>
    </section>

    <section class="card" id="formula"></section>

    <div class="days">
      <div class="seg" role="group" aria-label="Period">
        <button data-day="0" aria-pressed="true">Today</button>
        <button data-day="-1" aria-pressed="false">Yesterday</button>
        <button data-day="week" aria-pressed="false">This week</button>
      </div>
    </div>
    <div class="date" id="dateLabel" style="margin:-4px 2px 10px"></div>

    <div class="ribbon" aria-label="At a glance">
      <div id="lanesWrap"></div>
      <div class="legend">
        <span><i style="background:var(--feed)"></i>Feed (bigger dot = more ml)</span>
        <span><i class="bar"></i>Sleep</span>
        <span><i style="background:var(--wet)"></i>Wet</span>
        <span><i style="background:var(--dirty)"></i>Dirty</span>
        <span><i style="background:var(--mixed)"></i>Both</span>
      </div>
    </div>

    <div class="totals" id="totals"></div>

    <section class="card" id="compare"></section>

    <div class="filters" id="filters" role="group" aria-label="Show"></div>
    <div class="list" id="list"></div>
  </main>

  <main id="history">
    <div class="backrow"><button class="icon-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2 class="name" style="font-size:26px;margin:0">History</h2></div>
    <div class="seg" role="group" aria-label="Group by">
      <button data-gran="week" aria-pressed="true">Weeks</button>
      <button data-gran="month" aria-pressed="false">Months</button>
      <button data-gran="year" aria-pressed="false">Years</button>
    </div>
    <section class="card" id="histChart"></section>
    <section class="card" id="histPeriods"></section>
    <section class="card" id="records"></section>
    <section class="card" style="padding:14px 0 0;overflow:hidden">
      <h3 style="padding:0 14px">All entries</h3>
      <div class="filters" id="hfilters" style="margin:0 12px 10px"></div>
      <div id="hlist"></div>
    </section>
  </main>
</div>

<nav class="actions" aria-label="Log something">
  <div class="in">
    <button class="act feed" data-open="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M9 5h6l-1 3v12a2 2 0 0 1-2 2h0a2 2 0 0 1-2-2V8z"/><path d="M10 12h4M10 16h4"/></svg>Feed</button>
    <button class="act nappy" data-open="nappy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v3a9 9 0 0 1-18 0z"/><path d="M8 13c1 2 2.5 3 4 3s3-1 4-3"/></svg>Nappy</button>
    <button class="act sleep" data-open="sleep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep</button>
    <button class="act more" data-open="other"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Other</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- icons ---------- */
const IC = {
  feed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M9 5h6l-1 3v12a2 2 0 0 1-2 2h0a2 2 0 0 1-2-2V8z"/><path d="M10 12h4"/></svg>',
  breast:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>',
  wet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  dirty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h12a3 3 0 0 0 0-6h-1a3 3 0 0 0-3-5 3 3 0 0 0-5 1.5A3 3 0 0 0 6 12a3 3 0 0 0 0 6z"/></svg>',
  mixed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3s4 4.5 4 7.5a4 4 0 0 1-8 0C4 7.5 8 3 8 3z"/><path d="M12 20h7a2.5 2.5 0 0 0 0-5h-.5a2.5 2.5 0 0 0-4.5-2"/></svg>',
  sleep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  pill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-45 12 12)"/><path d="M9 9l6 6"/></svg>',
  drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3h6M10 3v5l-4 9a2 2 0 0 0 2 3h8a2 2 0 0 0 2-3l-4-9V3"/></svg>',
  pump:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4h10l-2 5H9z"/><path d="M9 9v9a3 3 0 0 0 6 0V9"/></svg>',
  temp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>',
  weight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8h12l2 12H4z"/><circle cx="12" cy="5" r="2"/></svg>',
  bath:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18v2a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M6 12V5a2 2 0 0 1 4 0"/></svg>',
  tummy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="9" r="3"/><path d="M3 18c2-4 6-5 9-4l9 2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>'
};
const OTHER = [
  {k:'Medicine', ic:'pill', ph:'e.g. Calpol 2.5 ml'},
  {k:'Supplement', ic:'drop', ph:'e.g. Vitamin D drops'},
  {k:'Pumping', ic:'pump', ph:'Amount in ml'},
  {k:'Temperature', short:'Temp', ic:'temp', ph:'e.g. 37.2 °C'},
  {k:'Weight', ic:'weight', ph:'e.g. 5.4 kg'},
  {k:'Bath', ic:'bath', ph:''},
  {k:'Tummy time', ic:'tummy', ph:'Minutes'},
  {k:'Note', ic:'note', ph:''}
];

const BUILTIN_OTHER = OTHER.map(o => o.k);

/* ---------- storage ---------- */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } }
};
let cfg = Object.assign({api:'', key:'', by:'', baby:'Constance', custom:[],
  supps:['Vitamin D','Infacol','Colief','Gaviscon','Probiotic']}, store.get('bl.cfg', {}));
if (!Array.isArray(cfg.custom)) cfg.custom = [];
(function readSetupLink(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('api')) return;
  cfg.api = h.get('api'); cfg.key = h.get('k') || '';
  if (h.get('baby')) cfg.baby = h.get('baby');
  store.set('bl.cfg', cfg);
  history.replaceState(null, '', location.pathname);
})();
const isDemo = () => !cfg.api || !cfg.key;

let entries = store.get('bl.cache', []);
let outbox = store.get('bl.outbox', []);
let meta = store.get('bl.meta', {lastSync:'', lastFull:'', lastBackup:'', sheetUrl:''});
let view = {day: 0, filter: 'all', cmp: 'feed', gran: 'week', hfilter: 'all', hdays: 7, hist: false};
let syncState = 'ok';

/* ---------- time helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
function dayStart(off, from){ const d = from ? new Date(from) : new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + off); return d; }
function weekStart(d){ const x = dayStart(0, d); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtDay = d => d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const fmtShort = d => d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
function dur(min){ min = Math.max(0, Math.round(min)); if (min < 60) return min + 'm'; const h = Math.floor(min/60), m = min % 60; return h + 'h' + (m ? ' ' + m + 'm' : ''); }
function ago(t){ return dur((Date.now() - new Date(t).getTime()) / 60000); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const toLocalInput = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + hm(d);
const isOpenSleep = e => e.type === 'sleep' && (e.duration_min === '' || e.duration_min == null);
const ml = e => Number(e.amount_ml) || 0;
const round = (n, p) => { const f = Math.pow(10, p || 0); return Math.round(n * f) / f; };

/* ---------- labels ---------- */
function feedTitle(e){
  if (e.detail && e.detail.startsWith('breast')) {
    const side = e.detail.split('-')[1] || 'both';
    return 'Breastfeed, ' + (side === 'both' ? 'both sides' : side);
  }
  return (e.amount_ml ? e.amount_ml + ' ml ' : '') + (e.detail === 'expressed' ? 'expressed milk' : 'formula');
}
function title(e){
  if (e.type === 'feed') return feedTitle(e);
  if (e.type === 'nappy') return e.detail === 'mixed' ? 'Wet and dirty' : e.detail === 'dirty' ? 'Dirty nappy' : 'Wet nappy';
  if (e.type === 'sleep') return isOpenSleep(e) ? 'Asleep' : 'Slept ' + dur(e.duration_min);
  return e.detail + (e.value ? ': ' + e.value : '');
}
function sub(e){
  const bits = [];
  if (e.type === 'feed' && e.detail && e.detail.startsWith('breast') && e.duration_min) bits.push(dur(e.duration_min));
  if (e.supplements && e.supplements.length) bits.push('with ' + [].concat(e.supplements).join(', '));
  if (e.type === 'sleep' && !isOpenSleep(e)) bits.push('until ' + hm(new Date(new Date(e.time).getTime() + e.duration_min * 60000)));
  if (e.notes) bits.push(e.notes);
  return bits.join('. ');
}
function otherIcon(k){ return (OTHER.find(o => o.k === k) || {ic:'note'}).ic; }
function badge(e){
  const map = {feed:['feed','--feed'], wet:['wet','--wet'], dirty:['dirty','--dirty'], mixed:['mixed','--mixed'], sleep:['sleep','--sleep']};
  const k = e.type === 'nappy' ? e.detail : e.type;
  let [icon, col] = map[k] || ['note','--other'];
  if (e.type === 'feed' && e.detail.startsWith('breast')) icon = 'breast';
  if (e.type === 'other') icon = otherIcon(e.detail);
  return `<span class="badge" style="color:var(${col});background:color-mix(in srgb,var(${col}) 15%,transparent)">${IC[icon]}</span>`;
}
const who = e => e.source === 'alexa' ? 'Alexa' : e.source === 'baby-tracker' ? '' : (e.by || '');

/* ---------- data ---------- */
let cacheAll = null;
function all(){
  if (cacheAll) return cacheAll;
  const byId = new Map(entries.map(e => [e.id, e]));
  for (const op of outbox) {
    if (op.action === 'delete') byId.delete(op.id);
    else byId.set(op.entry.id, op.entry);
  }
  const list = [...byId.values()].map(e => (e._t = new Date(e.time).getTime(), e)).sort((a, b) => b._t - a._t);
  cacheStock = list.filter(e => e.type === 'stock');
  cacheAll = list.filter(e => e.type !== 'stock');
  return cacheAll;
}
let cacheStock = [];
function stockList(){ all(); return cacheStock; }
const dirty = () => { cacheAll = null; };
function between(a, b){ return all().filter(e => e._t >= a && e._t < b); }
function forDay(off){ return between(dayStart(off).getTime(), dayStart(off + 1).getTime()); }
const openSleep = () => all().find(isOpenSleep);
const FILTERS = [['all','All'],['feed','Feeds'],['nappy','Nappies'],['sleep','Sleep'],['other','Other']];
const applyFilter = (list, f) => f === 'all' ? list : list.filter(e => e.type === f);
function otherTypes(){
  const seen = new Set(BUILTIN_OTHER);
  const extra = [];
  for (const k of cfg.custom.concat(all().filter(e => e.type === 'other').map(e => e.detail)))
    if (k && !seen.has(k)) { seen.add(k); extra.push(k); }
  return extra;
}
// average over previous 7 days of something measured from midnight to the current time of day
function weekAvgByNow(fn){
  const into = Date.now() - dayStart(0).getTime(); let sum = 0, n = 0;
  for (let d = 1; d <= 7; d++) {
    const s = dayStart(-d).getTime(); const list = between(s, s + into);
    if (!between(s, s + 86400000).length) continue;
    sum += fn(list); n++;
  }
  return n ? sum / n : null;
}

/* ---------- render ---------- */
function render(){
  $('#babyName').textContent = cfg.baby || 'Baby';
  document.title = (cfg.baby || 'Baby') + ' log';
  document.body.classList.toggle('hist', view.hist);
  renderStatus(); renderBanner();
  if (view.hist) renderHistory(); else { renderHero(); renderFormula(); renderDay(); }
}
function renderStatus(){
  const el = $('#status');
  let txt, warn = false;
  if (isDemo()) { txt = 'Demo data'; warn = true; }
  else if (outbox.length) { txt = outbox.length + ' waiting to sync'; warn = true; }
  else if (syncState === 'offline') { txt = 'Can’t reach your Sheet'; warn = true; }
  else txt = meta.lastSync ? 'Synced ' + hm(new Date(meta.lastSync)) : 'Connecting';
  el.className = 'status' + (warn ? ' warn' : '');
  el.querySelector('span').textContent = txt;
}
let installPrompt = null;
const installed = () => matchMedia('(display-mode: standalone)').matches || store.get('bl.installed', false);
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); installPrompt = ev; renderBanner(); });
window.addEventListener('appinstalled', () => { store.set('bl.installed', true); installPrompt = null; renderBanner(); });
function renderBanner(){
  let h = '';
  if (isDemo()) h += `<div class="banner">This is demo data, so nothing is saved yet. <button data-open="settings">Connect your Google Sheet</button> to start logging for real.</div>`;
  else if (!cfg.by) h += `<div class="banner"><strong>Who’s using this phone?</strong>
      <div class="chips" style="margin-top:10px">${['Jordan','Millie'].map(n => `<button class="chip" data-firstby="${n}">${n}</button>`).join('')}</div></div>`;
  if (!isDemo() && !installed() && !view.hist) {
    h += installPrompt
      ? `<div class="banner install"><span>Add this app to your home screen so it opens like any other app.</span><button class="primary" data-install style="margin-top:10px">Install app</button></div>`
      : `<div class="banner install">To add this app to your home screen, tap Chrome’s <strong>⋮</strong> menu, then <strong>Install app</strong> or <strong>Add to home screen</strong>.</div>`;
  }
  $('#banner').innerHTML = h;
}
function renderHero(){
  const list = all();
  const feed = list.find(e => e.type === 'feed');
  const nappy = list.find(e => e.type === 'nappy');
  if (feed) {
    const m = Math.max(0, Math.round((Date.now() - feed._t) / 60000));
    const h = Math.floor(m / 60), r = m % 60;
    $('#since').innerHTML = h ? `${h}<small>h</small> ${r}<small>m</small>` : `${r}<small>m</small>`;
    $('#sinceWhat').textContent = feedTitle(feed) + ' at ' + hm(new Date(feed.time));
  } else { $('#since').textContent = '–'; $('#sinceWhat').textContent = 'No feeds logged yet'; }
  $('#lastNappy').textContent = nappy ? ago(nappy.time) : '–';
  $('#lastNappyWhat').textContent = nappy ? title(nappy) + ', ' + hm(new Date(nappy.time)) : '';
  const today = forDay(0).filter(e => e.type === 'feed');
  const total = today.reduce((s, e) => s + ml(e), 0);
  $('#todayMl').textContent = total + ' ml';
  $('#todayFeeds').textContent = today.length + (today.length === 1 ? ' feed' : ' feeds');
  const avg = weekAvgByNow(l => l.filter(e => e.type === 'feed').reduce((s, e) => s + ml(e), 0));
  $('#weekAvgMl').textContent = avg == null ? '' : 'Week average by ' + hm(new Date()) + ': ' + Math.round(avg) + ' ml';
  const s = openSleep();
  $('#asleep').innerHTML = s ? `<div class="asleep"><span>Asleep for ${ago(s.time)}</span><button data-wake>Woke up</button></div>` : '';
}

function laneMarks(list, start, span, lanes){
  const pct = t => Math.min(100, Math.max(0, (t - start) / span * 100));
  let html = '';
  for (const e of list) {
    if (e.type === 'feed' && lanes.feed != null) {
      const size = e.amount_ml ? Math.min(16, 7 + ml(e) / 20) : 10;
      html += `<span class="dot feed" title="${esc(title(e))}" style="left:${pct(e._t)}%;top:${lanes.feed}px;width:${size}px;height:${size}px"></span>`;
    } else if (e.type === 'nappy' && lanes.nappy != null) {
      html += `<span class="dot ${esc(e.detail)}" title="${esc(title(e))}" style="left:${pct(e._t)}%;top:${lanes.nappy}px;width:10px;height:10px"></span>`;
    } else if (e.type === 'sleep' && lanes.sleep != null) {
      const endT = isOpenSleep(e) ? Date.now() : e._t + e.duration_min * 60000;
      const a = pct(e._t), b = pct(endT);
      html += `<span class="bar" style="left:${a}%;width:${Math.max(0.6, b - a)}%;top:${lanes.sleep}px"></span>`;
    }
  }
  return html;
}
function periodRange(){
  if (view.day === 'week') { const s = weekStart(new Date()); return [s.getTime(), dayStart(1).getTime()]; }
  return [dayStart(view.day).getTime(), dayStart(view.day + 1).getTime()];
}
function renderDay(){
  document.querySelectorAll('[data-day]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day) === String(view.day)));

  // ribbon

    let rows = '';

      rows += `<div class="weekrow"><span class="dl${isToday ? ' today' : ''}">${d.toLocaleDateString('en-GB', {weekday:'short'})}</span>
        <div class="wlane">${laneMarks(day, t, 86400000, {feed: lanes.feed && 11, sleep: lanes.sleep && 11, nappy: lanes.nappy && 11})}</div></div>`;
    }
    $('#lanesWrap').innerHTML = `<div class="weekrows">${rows}</div><div class="hours" style="padding-left:42px"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>`;
  } else {
    let html = `<div class="lane" style="top:14px"></div><div class="lane" style="top:37px"></div><div class="lane" style="top:60px"></div>`;
    html += laneMarks(list, a, 86400000, {feed: lanes.feed && 14, sleep: lanes.sleep && 37, nappy: lanes.nappy && 60});
    if (view.day === 0) html += `<span class="nowline" style="left:${(Date.now() - a) / 864000}%"></span>`;
    $('#lanesWrap').innerHTML = `<div class="lanes">${html}</div><div class="hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>`;
  }

  // totals

  const nap = list.filter(e => e.type === 'nappy');

  $('#totals').innerHTML = `

    <div class="tot"><div class="n">${nap.length}</div><div class="t">nappies<br>${c('wet')} wet, ${c('dirty')} dirty${c('mixed') ? ', ' + c('mixed') + ' both' : ''}</div></div>
    <div class="tot"><div class="n">${slept ? dur(slept) : '0'}</div><div class="t">sleep logged</div></div>`;

  $('#list').innerHTML = listHtml(shown, view.day === 'week',

function rowHtml(e){

function listHtml(list, grouped, empty){

/* comparison: today vs yesterday vs the 7-day average */
function renderCompare(){
  const kind = view.cmp;
  const label = {feed:'Feeds', nappy:'Nappies', sleep:'Sleep'}[kind];
  const t0 = dayStart(0).getTime(), t1 = dayStart(-1).getTime();
  const pick = l => l.filter(e => e.type === kind);
  const lane = (start) => `<div class="wlane">${laneMarks(pick(between(start, start + 86400000)), start, 86400000, {[kind]: 11})}${start === t0 ? `<span class="nowline" style="left:${(Date.now() - t0) / 864000}%"></span>` : ''}</div>`;
  // hourly average over the previous 7 days
  const hours = new Array(24).fill(0); let days = 0;
  for (let d = 1; d <= 7; d++) {
    const s = dayStart(-d).getTime(), l = pick(between(s, s + 86400000));
    if (!between(s, s + 86400000).length) continue; days++;
    for (const e of l) {
      if (kind === 'sleep') {
        const end = isOpenSleep(e) ? e._t : e._t + e.duration_min * 60000;
        for (let t = e._t; t < end; t += 3600000) { const h = new Date(t).getHours(); hours[h] += Math.min(60, (end - t) / 60000) / 60; }
      } else hours[new Date(e._t).getHours()] += 1;
    }
  }
  const avg = hours.map(v => days ? v / days : 0);
  const max = Math.max(0.0001, ...avg);
  const col = kind === 'feed' ? '--feed' : kind === 'nappy' ? '--wet' : '--sleep';
  const bars = `<div class="avgbars">${avg.map(v => `<i style="height:${Math.round(v / max * 100)}%;background:var(${col})"></i>`).join('')}</div>`;

  // "by this time" numbers
  const into = Date.now() - t0;
  const measure = l => {
    const p = pick(l);
    if (kind === 'feed') return {n: p.length, ml: p.reduce((s, e) => s + ml(e), 0)};
    if (kind === 'sleep') return {n: p.reduce((s, e) => s + (isOpenSleep(e) ? (Date.now() - e._t) / 60000 : Number(e.duration_min)), 0)};
    return {n: p.length, dirty: p.filter(e => e.detail !== 'wet').length};
  };
  const td = measure(between(t0, Date.now())), yd = measure(between(t1, t1 + into));
  const wk = {n: weekAvgByNow(l => measure(l).n), ml: weekAvgByNow(l => measure(l).ml || 0), dirty: weekAvgByNow(l => measure(l).dirty || 0)};
  const fmt = (m) => kind === 'feed' ? `<b>${round(m.n, 1)}</b> feeds, ${Math.round(m.ml)} ml`
    : kind === 'sleep' ? `<b>${dur(m.n)}</b>` : `<b>${round(m.n, 1)}</b> nappies, ${round(m.dirty, 1)} with poo`;
  $('#compare').innerHTML = `
    <h3>Compare <span class="seg small" role="group">${[['feed','Feeds'],['nappy','Nappies'],['sleep','Sleep']].map(([k, l]) => `<button data-cmp="${k}" aria-pressed="${kind === k}">${l}</button>`).join('')}</span></h3>
    <div class="cmp">
      <span class="rl">Today</span>${lane(t0)}
      <span class="rl">Yesterday</span>${lane(t1)}
      <span class="rl">7-day avg</span>${bars}
      <span></span><div class="hours2"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    </div>
    <div class="bythis">${label} by ${hm(new Date())}:<br>Today ${fmt(td)}<br>Yesterday ${fmt(yd)}<br>7-day average ${wk.n == null ? 'not enough data' : fmt(wk)}</div>`;
}

/* ---------- formula stock ---------- */
const FORMULA_DEFAULTS = {tin: 400, scoops: 5, ml: 165, scoop: 4.6};
function stockOf(detail){ return stockList().filter(e => e.detail === detail); }
function formulaCfg(){
  const s = stockOf('settings')[0], out = Object.assign({}, FORMULA_DEFAULTS);
  if (s) String(s.value).split(';').forEach(p => { const kv = p.split('='); if (kv[0] in out && Number(kv[1]) > 0) out[kv[0]] = Number(kv[1]); });
  return out;
}
function spareTins(){ const s = stockOf('spares')[0]; return s ? Math.max(0, Number(s.value) || 0) : 0; }
function stockEntry(detail, value){
  return {id: uid(), time: new Date().toISOString(), type: 'stock', detail: detail, amount_ml: '', duration_min: '',
    value: String(value), supplements: [], notes: '', source: 'app', by: cfg.by || ''};
}
function formulaStatus(){
  const f = formulaCfg(), opened = stockOf('opened')[0];
  if (!opened) return null;
  const gPerMl = f.scoops * f.scoop / f.ml, tinG = Number(opened.value) || f.tin;
  const usedMl = all().filter(e => e.type === 'feed' && e.detail === 'formula' && e._t >= opened._t).reduce((s, e) => s + ml(e), 0);
  const left = Math.max(0, tinG - usedMl * gPerMl);
  let sum = 0, n = 0;
  for (let d = 1; d <= 7; d++) {
    const s0 = dayStart(-d).getTime(), list = between(s0, s0 + 86400000);
    if (!list.length) continue;
    sum += list.filter(e => e.type === 'feed' && e.detail === 'formula').reduce((s, e) => s + ml(e), 0); n++;
  }
  const dailyG = n ? sum / n * gPerMl : 0, spares = spareTins();
  return {f: f, opened: opened, tinG: tinG, left: left, pct: tinG ? left / tinG : 0, bottles: Math.floor(left / (f.scoops * f.scoop)),
    dailyG: dailyG, days: dailyG ? left / dailyG : null, spares: spares, allDays: dailyG ? (left + spares * f.tin) / dailyG : null};
}
function whenFromNow(days){
  const d = new Date(Date.now() + days * 86400000), h = d.getHours();
  const part = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  return d.toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}) + ' ' + part;
}
const daysText = n => n < 1 ? 'less than a day' : n < 1.5 ? 'about a day' : 'about ' + Math.round(n) + ' days';
function renderFormula(){
  const el = $('#formula'); if (!el) return;
  const st = formulaStatus();
  if (!st) {
    el.innerHTML = '<h3>Formula stock</h3><p class="hint" style="margin:0 0 12px;font-size:14px">See how much is left in the tin and when you’ll need more.  Start by telling the app you’ve opened a tin.</p>' +
      '<button class="primary" data-opentin style="margin:0">I’ve opened a new tin</button>' +
      '<button class="ghost" data-open="formula">Tin size and scoops</button>';
    return;
  }
  const low = st.allDays != null && st.allDays < 3;
  const col = st.pct < 0.2 ? 'var(--danger)' : 'var(--feed)';
  el.innerHTML = '<h3>Formula stock <button class="linky" data-open="formula">Edit</button></h3>' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">' +
      '<div><span style="font-size:26px;font-weight:700;letter-spacing:-.02em">' + Math.round(st.left) + ' g</span>' +
      '<span class="hint" style="margin-left:6px">left of ' + st.tinG + ' g</span></div>' +
      '<div class="hint" style="margin:0">' + st.bottles + ' bottles</div></div>' +
    '<div style="height:8px;border-radius:4px;background:var(--surface-2);margin:10px 0 12px;overflow:hidden">' +
      '<div style="height:100%;width:' + Math.round(st.pct * 100) + '%;background:' + col + ';border-radius:4px"></div></div>' +
    '<div class="bythis" style="margin-top:0;padding-top:0;border-top:0">' +
      (st.days == null ? 'Not enough feeds logged yet to estimate.' :
        'This tin: ' + daysText(st.days) + ', until around ' + whenFromNow(st.days) + '.<br>' +
        (st.spares ? st.spares + (st.spares === 1 ? ' spare tin' : ' spare tins') + ': ' + daysText(st.allDays) + ' in total, until around ' + whenFromNow(st.allDays) + '.'
                   : 'No spare tins in the cupboard.')) +
      (low ? '<br><b style="color:var(--danger)">Time to buy more formula.</b>' : '') + '</div>' +
    '<button class="ghost" data-opentin>Opened a new tin</button>';
}
function formulaSheetHtml(){
  const f = formulaCfg();
  const num = (id, label, v, hint) => '<div class="field"><div class="lab">' + label + '</div><input type="number" inputmode="decimal" id="' + id + '" value="' + v + '">' + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';

function saveStock(){
  const f = formulaCfg(), g = id => Number($('#' + id).value);
  const next = {tin: g('fTin'), scoops: g('fScoops'), ml: g('fMl'), scoop: g('fScoop')};
  for (const k in next) if (!(next[k] > 0)) next[k] = f[k];
  if (Object.keys(next).some(k => next[k] !== f[k]))
    queue({action: 'add', entry: stockEntry('settings', Object.keys(next).map(k => k + '=' + next[k]).join(';'))});
  const sp = Math.max(0, Math.round(g('fSpares') || 0));
  if (sp !== spareTins()) queue({action: 'add', entry: stockEntry('spares', sp)});
  closeSheet(); toast('Formula stock saved');
}
function openTin(){
  const f = formulaCfg(), sp = spareTins();
  queue({action: 'add', entry: stockEntry('opened', f.tin)});
  if (sp > 0) queue({action: 'add', entry: stockEntry('spares', sp - 1)});
  if (D) closeSheet();
  toast('New ' + f.tin + ' g tin started' + (sp > 0 ? ', ' + (sp - 1) + ' spare left' : ''));
}

/* ---------- history ---------- */
function periodKey(d, gran){
  if (gran === 'year') return String(d.getFullYear());
  if (gran === 'month') return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  return dkey(weekStart(d));
}
function periodLabel(key, gran){
  if (gran === 'year') return key;
  if (gran === 'month') { const [y, m] = key.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('en-GB', {month:'long', year:'numeric'}); }
  const s = new Date(key + 'T00:00:00'), e = new Date(s); e.setDate(e.getDate() + 6);
  return fmtShort(s) + ' to ' + fmtShort(e);
}
function dailyTotals(){
  const days = new Map();
  for (const e of all()) {
    const k = dkey(new Date(e._t));
    let d = days.get(k);
    if (!d) days.set(k, d = {key: k, feeds: 0, ml: 0, nappies: 0, wet: 0, dirty: 0, mixed: 0, sleep: 0});
    if (e.type === 'feed') { d.feeds++; d.ml += ml(e); }
    else if (e.type === 'nappy') { d.nappies++; d[e.detail] = (d[e.detail] || 0) + 1; }
    else if (e.type === 'sleep' && !isOpenSleep(e)) d.sleep += Number(e.duration_min) || 0;
  }
  return days;
}
function renderHistory(){
  document.querySelectorAll('[data-gran]').forEach(b => b.setAttribute('aria-pressed', b.dataset.gran === view.gran));
  const gran = view.gran, days = dailyTotals();
  const periods = new Map();
  for (const d of days.values()) {
    const k = periodKey(new Date(d.key + 'T12:00:00'), gran);
    let p = periods.get(k);
    if (!p) periods.set(k, p = {key: k, days: 0, feeds: 0, ml: 0, nappies: 0, wet: 0, dirty: 0, mixed: 0, sleep: 0});
    p.days++; for (const f of ['feeds','ml','nappies','wet','dirty','mixed','sleep']) p[f] += d[f] || 0;
  }
  const list = [...periods.values()].sort((a, b) => b.key.localeCompare(a.key));
  if (!list.length) { $('#histChart').innerHTML = '<div class="empty">No history yet.</div>'; $('#histPeriods').innerHTML = ''; $('#records').innerHTML = ''; $('#hlist').innerHTML = ''; return; }

  // chart: average ml a day per period, oldest to newest
  const chartList = list.slice(0, gran === 'week' ? 12 : gran === 'month' ? 12 : 6).reverse();
  const W = 340, H = 150, padB = 22, padT = 16, bw = W / chartList.length;
  const vals = chartList.map(p => p.ml / p.days), max = Math.max(1, ...vals);
  const shortLab = p => gran === 'year' ? p.key : gran === 'month' ? new Date(p.key + '-01T12:00:00').toLocaleDateString('en-GB', {month:'short'}) : (d => d.getDate() + '/' + (d.getMonth() + 1))(new Date(p.key + 'T12:00:00'));
  const bars = chartList.map((p, i) => {
    const v = vals[i], h = Math.max(2, (v / max) * (H - padB - padT)), x = i * bw + bw * 0.18, w = bw * 0.64;
    return `<rect x="${x}" y="${H - padB - h}" width="${w}" height="${h}" rx="4" fill="var(--feed)" opacity="${i === chartList.length - 1 ? 1 : 0.55}"></rect>
      <text x="${x + w / 2}" y="${H - padB - h - 4}" text-anchor="middle">${Math.round(v)}</text>
      <text class="lab" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${shortLab(p)}</text>`;
  }).join('');
  $('#histChart').innerHTML = `<h3>Milk a day</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average millilitres a day per ${gran}">${bars}</svg>
    <div class="hint" style="margin-top:4px">Average ml a day for each ${gran}.</div>`;

  $('#histPeriods').innerHTML = `<h3>${gran === 'week' ? 'Weeks' : gran === 'month' ? 'Months' : 'Years'}</h3>` + list.slice(0, gran === 'week' ? 12 : 24).map(p => `
    <div class="pcard"><div class="pt">${periodLabel(p.key, gran)}</div>
      <div class="stats">
        <div><div class="n">${Math.round(p.ml / p.days)}</div><div class="t">ml a day<br>${p.ml.toLocaleString('en-GB')} ml total</div></div>
        <div><div class="n">${round(p.feeds / p.days, 1)}</div><div class="t">feeds a day<br>${p.feeds} total</div></div>
        <div><div class="n">${round(p.nappies / p.days, 1)}</div><div class="t">nappies a day<br>${p.wet} wet, ${p.dirty} dirty, ${p.mixed} both</div></div>
      </div></div>`).join('');

  renderRecords(days);

  // all entries, newest first, a week at a time
  const cutoff = dayStart(-(view.hdays - 1)).getTime();
  const filtered = applyFilter(all(), view.hfilter);
  const shown = filtered.filter(e => e._t >= cutoff);
  $('#hfilters').innerHTML = FILTERS.map(([k, l]) => `<button class="chip" data-hfilter="${k}" aria-pressed="${view.hfilter === k}">${l}</button>`).join('');
  $('#hlist').innerHTML = listHtml(shown, true, 'Nothing here yet.') +
    (filtered.length > shown.length ? `<button class="more" data-more>Show earlier entries</button>` : '');
}
function renderRecords(days){
  const feeds = all().filter(e => e.type === 'feed');
  const recs = [];
  const big = feeds.filter(e => ml(e)).sort((a, b) => ml(b) - ml(a))[0];
  if (big) recs.push([ml(big) + ' ml', 'biggest feed', big._t]);
  const dl = [...days.values()].filter(d => d.key !== dkey(new Date()));
  const top = f => dl.slice().sort((a, b) => b[f] - a[f])[0];
  const dayDate = d => new Date(d.key + 'T12:00:00').getTime();
  const tm = top('ml'); if (tm && tm.ml) recs.push([tm.ml + ' ml', 'most milk in a day', dayDate(tm)]);
  const tf = top('feeds'); if (tf && tf.feeds) recs.push([tf.feeds + ' feeds', 'most feeds in a day', dayDate(tf)]);
  const tn = top('nappies'); if (tn && tn.nappies) recs.push([tn.nappies + ' nappies', 'most in a day', dayDate(tn)]);
  const asc = feeds.slice().sort((a, b) => a._t - b._t); let gap = 0, gapAt = 0;
  for (let i = 1; i < asc.length; i++) { const g = asc[i]._t - asc[i - 1]._t; if (g > gap) { gap = g; gapAt = asc[i]._t; } }
  if (gap) recs.push([dur(gap / 60000), 'longest gap between feeds', gapAt]);
  const ls = all().filter(e => e.type === 'sleep' && !isOpenSleep(e)).sort((a, b) => b.duration_min - a.duration_min)[0];
  if (ls) recs.push([dur(ls.duration_min), 'longest sleep logged', ls._t]);
  $('#records').innerHTML = `<h3>Records</h3><div class="recs">${recs.map(([n, t, at]) =>
    `<div class="rec"><div class="n">${esc(n)}</div><div class="t">${t}<br>${new Date(at).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'})}</div></div>`).join('')}</div>`;
}

/* ---------- sync ---------- */
async function api(method, body, query){
  if (method === 'GET') {
    const r = await fetch(cfg.api + '?' + new URLSearchParams(Object.assign({k: cfg.key}, query)));
    return r.json();
  }
  const r = await fetch(cfg.api, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({k: cfg.key}, body))});
  return r.json();
}
const strip = e => { const c = Object.assign({}, e); delete c._t; return c; };
function saveCache(){ store.set('bl.cache', entries.map(strip)); }
async function refresh(full){
  if (isDemo()) return render();
  const needFull = full || !entries.length || !meta.lastFull || Date.now() - new Date(meta.lastFull).getTime() > 15 * 60000;
  try {
    const from = needFull ? null : dayStart(-8);
    const r = await api('GET', null, from ? {action:'list', from: from.toISOString()} : {action:'list'});
    if (!r.ok) throw new Error(r.error);
    if (from) entries = entries.filter(e => new Date(e.time).getTime() < from.getTime()).concat(r.entries);
    else entries = r.entries;
    dirty(); saveCache();
    meta = Object.assign(meta, {lastSync: new Date().toISOString(), lastBackup: r.lastBackup, sheetUrl: r.sheetUrl});
    if (!from) meta.lastFull = meta.lastSync;
    store.set('bl.meta', meta);
    syncState = 'ok';
  } catch (e) { syncState = 'offline'; }
  render();
}
let flushing = false;
async function flush(){
  if (isDemo() || flushing || !outbox.length) return;
  flushing = true;
  try {
    while (outbox.length) {
      const r = await api('POST', outbox[0]);
      if (!r.ok) throw new Error(r.error);
      outbox.shift(); store.set('bl.outbox', outbox);
    }
  } catch (e) { syncState = 'offline'; }
  flushing = false;
  refresh();
}
function queue(op){
  if (op.entry) op.entry = strip(op.entry);
  if (isDemo()) {
    if (op.action === 'delete') entries = entries.filter(e => e.id !== op.id);
    else { entries = entries.filter(e => e.id !== op.entry.id); entries.push(op.entry); }
    dirty(); return render();
  }
  outbox.push(op); store.set('bl.outbox', outbox); dirty(); render(); flush();
}
function saveEntry(e, isNew){
  e.by = e.by || cfg.by || '';
  e.source = e.source || 'app';
  queue({action: isNew ? 'add' : 'update', entry: e});
  closeSheet();
  toast((isNew ? 'Logged ' : 'Updated ') + title(e).charAt(0).toLowerCase() + title(e).slice(1),
    isNew ? () => queue({action:'delete', id: e.id}) : null);
}
function deleteEntry(id){ queue({action:'delete', id}); closeSheet(); toast('Deleted'); }

/* ---------- toast ---------- */
let toastT;
function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (undo ? '<button>Undo</button>' : '');
  if (undo) t.querySelector('button').onclick = () => { undo(); t.classList.remove('on'); };
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4000);
}

/* ---------- sheets ---------- */
let D = null;   // the entry being drafted
function openSheet(kind, existing){
  const base = existing ? strip(JSON.parse(JSON.stringify(existing))) : {id: uid(), type: kind, detail:'', amount_ml:'', duration_min:'', value:'', supplements:[], notes:''};
  base.supplements = [].concat(base.supplements || []);
  D = {kind, isNew: !existing, e: base, when: existing ? 'custom' : 'now', confirmDel: false, adding: false,
       custom: toLocalInput(existing ? new Date(existing.time) : new Date())};
  if (kind === 'feed' && !existing) { const last = all().find(x => x.type === 'feed' && !x.detail.startsWith('breast'));
    Object.assign(D.e, {detail: last ? last.detail : 'formula', amount_ml: last && last.amount_ml ? last.amount_ml : 120}); }
  if (kind === 'sleep' && !existing) { D.open = openSleep(); D.e.duration_min = ''; }
  $('#toast').classList.remove('on');
  drawSheet();
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); D = null; }

function pickedTime(){
  if (D.when === 'now') return new Date();
  if (D.when !== 'custom') return new Date(Date.now() - Number(D.when) * 60000);
  const d = new Date(D.custom);
  return isNaN(d) ? new Date() : d;
}
function timeField(label){
  const opts = D.isNew ? [['now','Now'],['2','2m ago'],['5','5m ago'],['15','15m ago'],['30','30m ago'],['custom','Custom']] : [];
  return `<div class="field"><div class="lab">${label || 'When'}</div>
    ${opts.length ? `<div class="chips">${opts.map(([v, l]) => `<button class="chip" data-when="${v}" aria-pressed="${D.when === v}">${l}</button>`).join('')}</div>` : ''}
    ${D.when === 'custom' ? `<input type="datetime-local" id="timeIn" value="${D.custom}" style="margin-top:10px" aria-label="Date and time">` : ''}</div>`;
}
function supplementsField(){
  return `<div class="field"><div class="lab">Given with this feed</div><div class="chips">
    ${cfg.supps.map(s => `<button class="chip" data-supp="${esc(s)}" aria-pressed="${D.e.supplements.includes(s)}">${esc(s)}</button>`).join('')}
    </div><div class="hint"><button class="linky" data-open="settings">Edit this list</button></div></div>`;
}
function notesField(){
  return `<div class="field"><div class="lab">Note</div><textarea id="notesIn" placeholder="Optional">${esc(D.e.notes)}</textarea></div>`;
}
function footer(label, cls){
  return `<div class="foot"><button class="primary ${cls || ''}" data-save>${D.isNew ? label : 'Save changes'}</button>` +
    (D.isNew ? '' : `<button class="ghost danger" data-del>${D.confirmDel ? 'Tap again to delete' : 'Delete'}</button>`) + '</div>';
}
function head(t){ return `<div class="grab"></div><h2 id="sheetTitle">${t}<button data-close aria-label="Close">×</button></h2>`; }

function drawSheet(){
  const e = D.e; let h = '';
  if (D.kind === 'feed') {
    const breast = e.detail.startsWith('breast');
    h = head(D.isNew ? 'Log a feed' : 'Edit feed') + `
      <div class="seg full" role="group"><button data-fk="bottle" aria-pressed="${!breast}">Bottle</button><button data-fk="breast" aria-pressed="${breast}">Breast</button></div>`;
    if (!breast) h += `
      <div class="field"><div class="chips">
        <button class="chip" data-det="formula" aria-pressed="${e.detail === 'formula'}">Formula</button>
        <button class="chip" data-det="expressed" aria-pressed="${e.detail === 'expressed'}">Expressed milk</button></div></div>
      <div class="field"><div class="lab">Amount</div><div class="amount"><button data-ml="-5" aria-label="5 ml less">−</button>
        <div class="mid"><input id="mlIn" type="number" inputmode="numeric" min="0" max="500" step="1" value="${e.amount_ml === '' ? '' : e.amount_ml}" aria-label="Amount in ml"><span class="unit">ml</span></div>
        <button data-ml="5" aria-label="5 ml more">+</button></div></div>`;
    else h += `
      <div class="field"><div class="lab">Side</div><div class="chips">
        ${['left','right','both'].map(s => `<button class="chip" data-det="breast-${s}" aria-pressed="${e.detail === 'breast-' + s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}</div></div>
      <div class="field"><div class="lab">Minutes</div><input id="durIn" type="number" inputmode="numeric" min="0" value="${e.duration_min === '' ? '' : e.duration_min}" placeholder="e.g. 15"></div>`;
    h += supplementsField() + timeField() + notesField() + footer('Log feed');
  }
  else if (D.kind === 'nappy') {
    h = head(D.isNew ? 'Log a nappy' : 'Edit nappy') + timeField() + `
      <div class="field"><div class="lab">${D.isNew ? 'Tap to log' : 'Type'}</div><div class="tiles">
        ${['wet','dirty','mixed'].map(k => `<button class="tile ${k}" data-nap="${k}" aria-pressed="${D.isNew || e.detail === k}">${IC[k]}${k === 'mixed' ? 'Both' : k[0].toUpperCase() + k.slice(1)}</button>`).join('')}
      </div></div>` + (D.isNew ? '' : notesField() + footer('', 'wet'));
  }
  else if (D.kind === 'sleep') {
    if (D.isNew && D.open) {
      h = head('Woke up') + `<p class="hint" style="font-size:15px">Asleep since ${hm(new Date(D.open.time))}, ${ago(D.open.time)} so far.</p>` +
        timeField('Woke up') + `<div class="foot"><button class="primary sleep" data-wakesave>Log wake up</button></div>`;
    } else {
      h = head(D.isNew ? 'Log sleep' : 'Edit sleep') + timeField('Fell asleep') + `
        <div class="field"><div class="lab">How long</div><div class="chips">
          <button class="chip" data-dur="" aria-pressed="${isOpenSleep(e)}">Still asleep</button>
          ${[30,60,90,120,180].map(v => `<button class="chip" data-dur="${v}" aria-pressed="${Number(e.duration_min) === v}">${dur(v)}</button>`).join('')}
        </div><input id="durIn" type="number" inputmode="numeric" min="0" value="${e.duration_min === '' ? '' : e.duration_min}" placeholder="Or type minutes" style="margin-top:10px"></div>` + notesField() + footer('Log sleep', 'sleep');
    }
  }
  else if (D.kind === 'other') {
    const extra = otherTypes();
    const o = OTHER.find(x => x.k === e.detail) || (e.detail ? {k: e.detail, ic: 'note', ph: 'Details (optional)'} : null);
    h = head(D.isNew ? 'Log something else' : 'Edit') + `
      <div class="grid4">${OTHER.map(x => `<button class="opt" data-oth="${esc(x.k)}" aria-pressed="${e.detail === x.k}">${IC[x.ic]}${x.short || x.k}</button>`).join('')}
      ${extra.map(k => `<button class="opt" data-oth="${esc(k)}" aria-pressed="${e.detail === k}">${IC.note}${esc(k)}</button>`).join('')}
      <button class="opt" data-addtype aria-pressed="${D.adding}">${IC.plus}New</button></div>
      ${D.adding ? `<div class="newtype"><input type="text" id="typeIn" placeholder="e.g. Vaccination, Bottle sterilised" maxlength="30"><button data-savetype>Add</button></div>` : ''}`;
    if (o) h += (o.ph ? `<div class="field"><div class="lab">Details</div><input type="text" id="valIn" value="${esc(e.value)}" placeholder="${esc(o.ph)}"></div>` : '') +
      timeField() + notesField() + footer('Log ' + o.k.toLowerCase(), 'other');
  }
  else if (D.kind === 'settings') h = settingsHtml();
  else if (D.kind === 'formula') h = formulaSheetHtml();
  $('#sheetIn').innerHTML = h;
  const mlIn = $('#mlIn');
  if (mlIn) mlIn.addEventListener('focus', () => mlIn.select());
}

function settingsHtml(){
  return head('Settings') + `
    <div class="field"><div class="lab">Who’s using this phone</div><div class="chips">
      ${['Jordan','Millie'].map(n => `<button class="chip" data-by="${n}" aria-pressed="${cfg.by === n}">${n}</button>`).join('')}</div></div>
    <div class="field"><div class="lab">Baby’s name</div><input type="text" id="babyIn" value="${esc(cfg.baby)}"></div>
    <div class="field"><div class="lab">Supplements shown on feeds</div><input type="text" id="suppIn" value="${esc(cfg.supps.join(', '))}">
      <div class="hint">Separate with commas.</div></div>
    <div class="field"><div class="lab">Your own “Other” types</div><input type="text" id="customIn" value="${esc(cfg.custom.join(', '))}" placeholder="e.g. Vaccination, Bath toy">
      <div class="hint">Separate with commas.  Types logged on the other phone show up automatically.</div></div>
    <div class="field"><div class="lab">Google Sheet connection</div>
      <input type="url" id="apiIn" value="${esc(cfg.api)}" placeholder="Web app URL ending in /exec">
      <input type="text" id="keyIn" value="${esc(cfg.key)}" placeholder="App key" style="margin-top:8px" autocomplete="off"></div>
    <button class="primary" data-savesettings style="margin-top:20px">Save settings</button>
    ${cfg.api ? `<button class="ghost" data-share>Copy setup link for another phone</button>
      <button class="ghost" data-backup>Back up to Google Drive now</button>
      <div class="hint">Backs up automatically every night at 3am. ${meta.lastBackup ? 'Last backup ' + new Date(meta.lastBackup).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) + '.' : ''}
      ${meta.sheetUrl ? `<a class="linky" href="${esc(meta.sheetUrl)}" target="_blank" rel="noopener">Open the full log in Google Sheets</a>` : ''}</div>` : ''}`;
}

/* ---------- events ---------- */
document.addEventListener('input', ev => {
  if (!D) return;
  const id = ev.target.id, v = ev.target.value;
  if (id === 'notesIn') D.e.notes = v;
  if (id === 'valIn') D.e.value = v;
  if (id === 'timeIn') D.custom = v;
  if (id === 'mlIn') D.e.amount_ml = v === '' ? '' : Math.max(0, Math.round(Number(v)));
  if (id === 'durIn') { D.e.duration_min = v === '' ? '' : Math.max(0, Math.round(Number(v)));
    document.querySelectorAll('[data-dur]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dur) === String(D.e.duration_min))); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'typeIn') { ev.preventDefault(); $('[data-savetype]').click(); } });
document.addEventListener('click', ev => {
  const b = ev.target.closest('button, .scrim');
  if (!b) return;
  const d = b.dataset;
  if (b.id === 'scrim' || 'close' in d) return closeSheet();
  if (b.id === 'settingsBtn') return openSheet('settings');
  if (b.id === 'histBtn') { view.hist = true; view.hdays = 7; window.scrollTo(0, 0); return render(); }
  if (b.id === 'backBtn') { view.hist = false; window.scrollTo(0, 0); return render(); }
  if ('day' in d) { view.day = d.day === 'week' ? 'week' : Number(d.day); return renderDay(); }
  if (d.filter) { view.filter = d.filter; return renderDay(); }
  if (d.cmp) { view.cmp = d.cmp; return renderCompare(); }
  if (d.gran) { view.gran = d.gran; return renderHistory(); }
  if (d.hfilter) { view.hfilter = d.hfilter; view.hdays = 7; return renderHistory(); }
  if ('more' in d) { view.hdays += 14; return renderHistory(); }
  if (d.firstby) { cfg.by = d.firstby; store.set('bl.cfg', cfg); toast('Hi ' + cfg.by); return renderBanner(); }
  if ('install' in d) { if (installPrompt) { installPrompt.prompt(); installPrompt.userChoice.then(c => { if (c.outcome === 'accepted') store.set('bl.installed', true); installPrompt = null; renderBanner(); }); } return; }
  if (d.open) { if (D) closeSheet(); return setTimeout(() => openSheet(d.open), 0); }
  if ('opentin' in d) return openTin();
  if ('savestock' in d) return saveStock();
  if (d.spares) { const i = $('#fSpares'); i.value = Math.max(0, (Number(i.value) || 0) + Number(d.spares)); return; }
  if (d.edit) { const e = all().find(x => x.id === d.edit); if (e) openSheet(e.type, e); return; }
  if ('wake' in d) { const s = openSleep(); if (s) { const e = Object.assign(strip(s), {duration_min: Math.max(1, Math.round((Date.now() - s._t) / 60000))}); queue({action:'update', entry:e}); toast('Woke up after ' + dur(e.duration_min)); } return; }
  if (!D) return;
  const e = D.e;
  if (d.when) { D.when = d.when; if (d.when === 'custom') D.custom = toLocalInput(new Date()); }
  else if (d.fk) { e.detail = d.fk === 'breast' ? 'breast-both' : 'formula'; if (d.fk === 'breast') e.amount_ml = ''; else { e.amount_ml = e.amount_ml || 120; e.duration_min = ''; } }
  else if (d.det) e.detail = d.det;
  else if (d.ml) e.amount_ml = Math.max(0, (Number(e.amount_ml) || 0) + Number(d.ml));
  else if ('dur' in d) e.duration_min = d.dur === '' ? '' : Number(d.dur);
  else if (d.supp) e.supplements = e.supplements.includes(d.supp) ? e.supplements.filter(s => s !== d.supp) : e.supplements.concat(d.supp);
  else if (d.oth) { e.detail = d.oth; D.adding = false; }
  else if ('addtype' in d) { D.adding = !D.adding; drawSheet(); const i = $('#typeIn'); if (i) i.focus(); return; }
  else if ('savetype' in d) {
    const name = ($('#typeIn').value || '').trim().replace(/\s+/g, ' ');
    if (!name) return;
    const k = name.charAt(0).toUpperCase() + name.slice(1);
    if (!BUILTIN_OTHER.includes(k) && !cfg.custom.includes(k)) { cfg.custom.push(k); store.set('bl.cfg', cfg); }
    e.detail = k; D.adding = false;
  }
  else if (d.nap) { e.detail = d.nap; if (D.isNew) { e.time = pickedTime().toISOString(); return saveEntry(e, true); } }
  else if (d.by) { cfg.by = d.by; store.set('bl.cfg', cfg); document.querySelectorAll('[data-by]').forEach(x => x.setAttribute('aria-pressed', x.dataset.by === cfg.by)); return; }
  else if ('save' in d) {
    if (D.kind === 'feed' && !e.detail.startsWith('breast') && !(Number(e.amount_ml) > 0)) { toast('Type how many ml first'); const i = $('#mlIn'); if (i) i.focus(); return; }
    e.time = pickedTime().toISOString(); return saveEntry(e, D.isNew);
  }
  else if ('wakesave' in d) { const s = strip(D.open); s.duration_min = Math.max(1, Math.round((pickedTime() - new Date(s.time)) / 60000)); return saveEntry(s, false); }
  else if ('del' in d) { if (D.confirmDel) return deleteEntry(e.id); D.confirmDel = true; }
  else if ('savesettings' in d) {
    cfg.baby = $('#babyIn').value.trim() || 'Baby';
    cfg.supps = $('#suppIn').value.split(',').map(s => s.trim()).filter(Boolean);
    cfg.custom = $('#customIn').value.split(',').map(s => s.trim()).filter(Boolean);
    const api = $('#apiIn').value.trim(), key = $('#keyIn').value.trim();
    const changed = api !== cfg.api || key !== cfg.key;
    cfg.api = api; cfg.key = key; store.set('bl.cfg', cfg);
    if (changed) { entries = []; dirty(); saveCache(); }
    closeSheet(); toast('Settings saved'); return refresh(changed);
  }
  else if ('share' in d) {
    const link = location.origin + location.pathname + '#' + new URLSearchParams({api: cfg.api, k: cfg.key, baby: cfg.baby});
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Setup link copied'), () => prompt('Copy this link', link));
    return;
  }
  else if ('backup' in d) {
    toast('Backing up…');
    api('POST', {action:'backup'}).then(r => { if (!r.ok) throw 0; toast('Backed up to Google Drive'); refresh(); }).catch(() => toast('Backup failed. Check the connection in settings.'));
    return;
  }
  else return;
  drawSheet();
});

/* ---------- demo data (only shown before a Sheet is connected) ---------- */
function seedDemo(){
  const out = []; const now = Date.now();
  const at = (off, h, m) => { const d = dayStart(off); d.setHours(h, m); return d.toISOString(); };
  const add = (o) => out.push(Object.assign({id: uid(), detail:'', amount_ml:'', duration_min:'', value:'', supplements:[], notes:'', source:'app', by:'Millie'}, o));
  for (let off = -9; off <= 0; off++) {
    [[0,40,150],[3,55,120],[7,10,150],[10,30,150],[13,45,120],[16,50,180],[20,5,150]].forEach(([h, m, mlv], i) => {
      const mm = (m + off * 7 + 70) % 60;
      if (new Date(at(off, h, mm)).getTime() > now) return;
      add({time: at(off, h, mm), type:'feed', detail:'formula', amount_ml: mlv - ((off + 9) % 3) * 10, supplements: i === 2 ? ['Vitamin D'] : [], source: i % 3 === 0 ? 'alexa' : 'app', by: i % 2 ? 'Jordan' : 'Millie'});
    });
    [[1,0,'wet'],[7,30,'dirty'],[11,0,'wet'],[14,10,'mixed'],[17,20,'wet'],[20,30,'wet']].forEach(([h, m, k], i) => {
      if (new Date(at(off, h, m)).getTime() > now) return;
      add({time: at(off, h, m), type:'nappy', detail: k, source: i % 2 ? 'alexa' : 'app', by:'Jordan'});
    });
    [[1,20,150],[11,20,75],[14,40,90]].forEach(([h, m, dd]) => {
      if (new Date(at(off, h, m)).getTime() + dd * 60000 > now) return;
      add({time: at(off, h, m), type:'sleep', duration_min: dd});
    });
  }
  return out;
}

/* ---------- start ---------- */
if (isDemo()) entries = seedDemo();
dirty();
render();
refresh(); flush();
setInterval(() => { if (!view.hist) { renderHero(); if (view.day === 0 || view.day === 'week') renderDay(); } }, 30000);
setInterval(() => { if (!document.hidden) { refresh(); flush(); } }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); flush(); } });
window.addEventListener('online', flush);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
